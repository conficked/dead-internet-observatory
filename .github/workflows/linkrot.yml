name: "🪦 Link-rot census"

# Revisit a fixed sample of Common Crawl URLs, classify each page's fate,
# publish the ledger to Hugging Face and the results to GitHub Pages.

on:
  schedule:
    - cron: "17 9 3 * *"   # monthly, on the 3rd
  workflow_dispatch:
    inputs:
      per_crawl:
        description: "URLs per crawl when (re)building the sample"
        default: "1000"
      refresh:
        description: "Add pages from new or short crawls to the sample (monthly runs always do)"
        type: boolean
        default: false
      rebuild:
        description: "Discard the sample and draw a new one (breaks month-to-month continuity)"
        type: boolean
        default: false
      limit:
        description: "Check at most N URLs per shard (0 = all; for test runs)"
        default: "0"

permissions:
  contents: read

concurrency:
  group: linkrot
  cancel-in-progress: false

env:
  HF_REPO: conficked/dead-internet-observatory
  SHARDS: "8"

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-linkrot.txt
      - run: pip install -r requirements-linkrot.txt

      - name: Reuse, extend or build the sample
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REFRESH: ${{ github.event_name == 'schedule' || inputs.refresh == true }}
          REBUILD: ${{ inputs.rebuild == true }}
          PER_CRAWL: ${{ inputs.per_crawl || '1000' }}
        run: |
          set -euo pipefail
          mkdir -p work
          EXISTING=""
          if [ "$REBUILD" != "true" ] && python -m linkrot.hf get linkrot/sample.jsonl.gz work/existing.jsonl.gz; then
            if [ "$REFRESH" != "true" ]; then
              mv work/existing.jsonl.gz work/sample.jsonl.gz
              echo "Reusing the published sample."
              exit 0
            fi
            EXISTING="--existing work/existing.jsonl.gz"
            echo "Extending the published sample with new and short crawls."
          else
            echo "Building a new sample."
          fi
          python -m linkrot.hf get gold/scored.parquet work/scored.parquet
          python -m linkrot.sample --input work/scored.parquet --out work/sample.jsonl.gz --per-crawl "$PER_CRAWL" $EXISTING
          rm -f work/scored.parquet work/existing.jsonl.gz
          python -m linkrot.hf put work/sample.jsonl.gz linkrot/sample.jsonl.gz "linkrot: update census sample"

      - uses: actions/upload-artifact@v4
        with:
          name: sample
          path: work/sample.jsonl.gz
          retention-days: 7

  check:
    needs: sample
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: sample
          path: work
      - name: Check shard ${{ matrix.shard }}
        env:
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          python -m linkrot.check \
            --sample work/sample.jsonl.gz \
            --out work/results-${{ matrix.shard }}.jsonl \
            --wayback-out work/wayback-${{ matrix.shard }}.jsonl \
            --shard ${{ matrix.shard }} --shards "$SHARDS" \
            --workers 48 --wayback-cap 800 --wayback-rate 0.5 \
            --time-budget 16200 --limit "$LIMIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.shard }}
          path: work/*-${{ matrix.shard }}.jsonl
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [sample, check]
    if: always() && needs.sample.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-linkrot.txt
      - run: pip install -r requirements-linkrot.txt
      - uses: actions/download-artifact@v4
        with:
          path: work
          merge-multiple: true

      - name: Restore the census history
        run: python -m linkrot.hf get linkrot/site/history.json site/data/history.json || echo "No history yet."

      - name: Aggregate
        run: |
          set -euo pipefail
          ls -la work
          DAY=$(date -u +%F)
          python -m linkrot.aggregate \
            --sample work/sample.jsonl.gz \
            --results 'work/results-*.jsonl' \
            --wayback 'work/wayback-*.jsonl' \
            --site site/data \
            --ledger "work/census-$DAY.jsonl.gz"
          python -m linkrot.report --sample work/sample.jsonl.gz --results 'work/results-*.jsonl'
          echo "DAY=$DAY" >> "$GITHUB_ENV"

      - name: Publish the ledger and site data to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m linkrot.hf put "work/census-$DAY.jsonl.gz" "linkrot/census/census-$DAY.jsonl.gz" "linkrot: census $DAY"
          for f in summary graveyard history; do
            python -m linkrot.hf put "site/data/$f.json" "linkrot/site/$f.json" "linkrot: site data $DAY"
          done

      - name: Stamp the build
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7}-${GITHUB_RUN_ID}/g" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
