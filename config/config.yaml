project:
  name: Dead Internet Observatory
  version: 1.0.0
  description: Observational signals in sampled public web text

storage:
  backend: local          # 'local' or 's3'
  local_path: ./data
  s3_bucket: dead-internet-observatory
  bronze_path: bronze
  silver_path: silver
  gold_path: gold
  db_path: ./data/observatory.db   # SQLite for Streamlit

sources:
  common_crawl:
    enabled: true
    # Quarterly snapshots — format CC-MAIN-YYYY-WW
    # 2012 uses older single-crawl naming; 2013+ use YYYY-WW weekly format
    crawl_dates:
      # 2013 — configured crawl dates
      - "2013-20"
      - "2013-48"
      # 2014
      - "2014-10"
      - "2014-42"
      # 2015
      - "2015-11"
      - "2015-40"
      # 2016
      - "2016-07"
      - "2016-44"
      # 2017
      - "2017-09"
      - "2017-43"
      # 2018
      - "2018-09"
      - "2018-43"
      # 2019 — configured crawl dates
      - "2019-09"
      - "2019-22"
      - "2019-35"
      - "2019-47"
      # 2020
      - "2020-10"
      - "2020-24"
      - "2020-40"
      - "2020-50"
      # 2021
      - "2021-04"
      - "2021-17"
      - "2021-31"
      - "2021-43"
      # 2022 — pre-ChatGPT
      - "2022-05"
      - "2022-21"
      - "2022-33"
      - "2022-49"
      # 2023 — ChatGPT era begins
      - "2023-06"
      - "2023-14"
      - "2023-23"
      - "2023-40"
      # 2024
      - "2024-10"
      - "2024-22"
      - "2024-33"
      - "2024-46"
      # 2025
      - "2025-05"
      - "2025-21"
    max_dates_per_run: 5        # dates processed per GitHub Actions run
    max_new_docs_per_run: 50000
    max_rows_per_crawl: 10000
    auto_reset_progress: false
    max_segments_per_date: 5
    wet_files_per_segment: 5
    max_records_per_wet: 2000

  reddit:
    enabled: true
    subreddits:
      - worldnews
      - technology
      - science
      - politics
      - AskReddit
      - todayilearned
      - news
      - gaming
      - explainlikeimfive
      - changemyview
    posts_per_sub: 500
    include_comments: true
    max_comments_per_post: 50

  news:
    enabled: true
    feeds:
      - https://feeds.reuters.com/reuters/topNews
      - https://rss.cnn.com/rss/edition.rss
      - https://feeds.bbci.co.uk/news/rss.xml
      - https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml
      - https://feeds.washingtonpost.com/rss/world
      - https://www.theguardian.com/world/rss
      - https://feeds.npr.org/1001/rss.xml
      - https://rss.politico.com/politics-news.xml
    max_articles_per_feed: 200
    request_timeout: 20

  wikipedia:
    enabled: true
    sample_articles: 500
    recent_changes_hours: 24
    track_namespaces: [0]   # Main article namespace only

  hackernews:
    enabled: true
    max_stories: 1000
    include_comments: true
    max_comments_per_story: 30
    lookback_days: 7         # harvest stories from the last N days

  bluesky:
    enabled: true
    max_posts: 1000
    search_terms:
      - technology
      - news
      - science
      - culture
      - sports

  fourchan:
    enabled: true
    boards: [g, sci, tv, lit, biz, int, x, his]
    threads_per_board: 15
    posts_per_thread: 50

  steam:
    enabled: true
    reviews_per_game: 100
    app_ids:
      - 730
      - 570
      - 440
      - 1172470
      - 1245620
      - 292030
      - 271590
      - 578080
      - 1091500
      - 2767030
      - 881100
      - 2379780
      - 220
      - 400
      - 620
      - 4000

  youtube:
    enabled: true
    videos_per_topic: 10
    comments_per_video: 100
    search_topics:
      - technology
      - artificial intelligence
      - world news
      - gaming
      - science

  linkedin:
    enabled: true
    max_articles: 100
    request_timeout: 20

  twitter:
    enabled: true
    max_tweets: 500
    search_terms:
      - technology
      - artificial intelligence
      - breaking news
      - science
      - world news
      - gaming
      - finance

  wayback:
    enabled: true
    snapshot_years: [2019, 2021, 2023, 2024, 2025]
    snapshots_per_year: 2    # CDX samples per sentinel URL per year
    sentinel_urls:
      # News front pages
      - https://www.reuters.com/
      - https://www.bbc.com/news
      - https://www.theguardian.com/international
      - https://apnews.com/
      # Tech / HN
      - https://news.ycombinator.com/
      - https://techcrunch.com/
      # Reddit (old.reddit renders better in Wayback)
      - https://old.reddit.com/r/worldnews/
      - https://old.reddit.com/r/technology/
      - https://old.reddit.com/r/science/
      # Reference
      - https://en.wikipedia.org/wiki/Artificial_intelligence
      - https://en.wikipedia.org/wiki/Main_Page
      # Forums / blogs
      - https://news.ycombinator.com/
      - https://lobste.rs/
      - https://marginalrevolution.com/

detection:
  scoring_version: iai-v2.0.0-provisional
  min_text_length: 80
  max_text_length_for_features: 5000
  # Provisional headline weights. They must sum to 1.0.
  # Hapax ratio, Yule's K, windowed lexical diversity and type-token ratio are
  # still extracted. They are omitted here so the vocabulary-richness family is
  # not counted alongside MTLD. scripts/feature_ablation.py measures the correlation.
  weights:
    mtld: 0.25
    sentence_variance: 0.18
    repetition: 0.17
    zipf_deviation: 0.12
    compression_ratio: 0.14
    character_entropy: 0.14
  # Provisional maps from raw features to [0, 1]. Replace this block with
  # feature_scaling from scripts/calibrate_detector.py after a real labeled run.
  feature_scaling:
    provisional: true
    compression_ratio:
      low: 0.25
      span: 0.55
    character_entropy:
      low: 3.0
      span: 2.0
    hapax_ratio:
      divisor: 0.7
    yules_k:
      divisor: 300.0
      invert: true
    lexical_diversity:
      low: 0.2
      span: 0.5

analytics:
  # Provisional fixed-panel weights derived by normalizing the v1 weights
  # across sources with supported, comparable timeline data.
  source_weights:
    common_crawl: 0.357142857143
    reddit: 0.178571428571
    news: 0.119047619048
    hackernews: 0.071428571429
    bluesky: 0.059523809524
    youtube: 0.059523809524
    fourchan: 0.047619047619
    steam: 0.035714285714
    mastodon: 0.035714285714
    stackoverflow: 0.035714285714
  core_source_panel:
    - common_crawl
    - reddit
    - news
    - hackernews
    - bluesky
    - youtube
    - fourchan
    - steam
    - mastodon
    - stackoverflow
  minimum_source_samples: 50
  minimum_total_samples: 500
  # Kept at 0.80. The tracked 2026 biweekly file never clears this panel:
  # reddit is absent and common crawl is a separate crawl series. Do not lower
  # this value to force a headline. See analytics/coverage_audit.py.
  minimum_coverage: 0.80
  bootstrap_resamples: 400
  bootstrap_seed: 0
  index_smoothing_window: 21       # days for rolling average
  anomaly_zscore_threshold: 2.5
  trend_min_data_points: 14

app:
  cache_ttl_seconds: 3600
  refresh_hint_seconds: 300
