analytics:
  anomaly_zscore_threshold: 2.5
  core_source_panel:
  - common_crawl
  - reddit
  - news
  - hackernews
  - bluesky
  - youtube
  - fourchan
  - steam
  - mastodon
  - stackoverflow
  bootstrap_resamples: 400
  bootstrap_seed: 0
  index_smoothing_window: 7
  minimum_coverage: 0.8
  minimum_source_samples: 50
  minimum_total_samples: 500
  source_weights:
    bluesky: 0.059523809524
    common_crawl: 0.357142857143
    fourchan: 0.047619047619
    hackernews: 0.071428571429
    mastodon: 0.035714285714
    news: 0.119047619048
    reddit: 0.178571428571
    stackoverflow: 0.035714285714
    steam: 0.035714285714
    youtube: 0.059523809524
  trend_min_data_points: 14
app:
  cache_ttl_seconds: 3600
  refresh_hint_seconds: 300
detection:
  feature_scaling:
    provisional: true
    character_entropy:
      low: 3.0
      span: 2.0
    compression_ratio:
      low: 0.25
      span: 0.55
    hapax_ratio:
      divisor: 0.7
    lexical_diversity:
      low: 0.2
      span: 0.5
    yules_k:
      divisor: 300.0
      invert: true
  max_text_length_for_features: 5000
  min_text_length: 80
  scoring_version: iai-v2.0.0-provisional
  weights:
    character_entropy: 0.14
    compression_ratio: 0.14
    mtld: 0.25
    repetition: 0.17
    sentence_variance: 0.18
    zipf_deviation: 0.12
project:
  description: Observational signals in sampled public web text
  name: Dead Internet Observatory
  version: 1.0.0
sources:
  common_crawl:
    crawl_dates:
    - 2023-14
    - 2024-10
    - 2024-33
    - 2025-06
    - 2025-21
    enabled: true
    max_records_per_wet: 2000
    max_segments_per_date: 3
    wet_files_per_segment: 5
  hackernews:
    enabled: true
    include_comments: false
    lookback_days: 7
    max_comments_per_story: 30
    max_stories: 200
  news:
    enabled: true
    feeds:
    - https://feeds.reuters.com/reuters/topNews
    - https://rss.cnn.com/rss/edition.rss
    - https://feeds.bbci.co.uk/news/rss.xml
    - https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml
    - https://feeds.washingtonpost.com/rss/world
    - https://www.theguardian.com/world/rss
    - https://feeds.npr.org/1001/rss.xml
    - https://rss.politico.com/politics-news.xml
    max_articles_per_feed: 40
    request_timeout: 20
  reddit:
    enabled: true
    include_comments: false
    max_comments_per_post: 50
    posts_per_sub: 50
    subreddits:
    - worldnews
    - technology
    - science
    - politics
    - AskReddit
    - todayilearned
    - news
    - gaming
    - explainlikeimfive
    - changemyview
  wayback:
    enabled: true
    sentinel_urls:
    - https://www.reuters.com/
    - https://www.bbc.com/news
    - https://www.theguardian.com/international
    - https://apnews.com/
    - https://news.ycombinator.com/
    - https://techcrunch.com/
    - https://old.reddit.com/r/worldnews/
    - https://old.reddit.com/r/technology/
    - https://old.reddit.com/r/science/
    - https://en.wikipedia.org/wiki/Artificial_intelligence
    - https://en.wikipedia.org/wiki/Main_Page
    - https://news.ycombinator.com/
    - https://lobste.rs/
    - https://marginalrevolution.com/
    snapshot_years:
    - 2019
    - 2021
    - 2023
    - 2024
    - 2025
    snapshots_per_year: 2
  wikipedia:
    enabled: true
    recent_changes_hours: 0
    sample_articles: 80
    track_namespaces:
    - 0
storage:
  backend: local
  bronze_path: bronze
  db_path: ./data/observatory.db
  gold_path: gold
  local_path: ./data
  s3_bucket: dead-internet-observatory
  silver_path: silver
